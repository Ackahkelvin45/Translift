name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build + typecheck + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build (ensures dist/ compiles — what publish ships)
        run: npm run build

  flake-check:
    name: flake-check (suite x20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      # The F6 wrapper work had one unreproduced flaky failure under CPU
      # contention. Run the suite 20x; any nondeterminism fails the job.
      - name: Run suite 20x
        run: |
          for i in $(seq 1 20); do
            echo "::group::run $i / 20"
            npm test
            echo "::endgroup::"
          done
